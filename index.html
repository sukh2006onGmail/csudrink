<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSU Drink - QR & Manual Search</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background: #f4f4f9; color: #333; }
    .card { max-width: 450px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    #reader { width: 100%; margin: 15px auto; border-radius: 8px; overflow: hidden; }
    
    .input-group { margin: 15px 0; text-align: left; }
    .input-group label { font-size: 14px; color: #666; font-weight: bold; display: block; margin-bottom: 5px; }
    input[type="text"] { width: 93%; padding: 12px; font-size: 16px; border: 2px solid #ddd; border-radius: 6px; text-align: center; }
    
    .btn { padding: 12px; font-size: 16px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 10px; }
    .btn-scan { background: #007bff; color: white; }
    .btn-search { background: #17a2b8; color: white; }
    .btn-give { background: #28a745; color: white; }
    .btn-give:disabled { background: #ccc; cursor: not-allowed; }
    
    #userCard { background: #e9ecef; padding: 15px; border-radius: 8px; margin-top: 15px; display: none; text-align: left; }
    #userCard p { margin: 5px 0; font-size: 16px; }
    #status { margin-top: 15px; font-weight: bold; font-size: 15px; word-break: break-all; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🥤 CSU Drink Manager</h2>
    
    <button class="btn btn-scan" onclick="startScan()">📷 QR Уншуулах</button>
    <div id="reader"></div>

    <div class="input-group">
      <label>Хэрэглэгчийн ID эсвэл Нэрээр хайх:</label>
      <input type="text" id="searchInput" placeholder="ID эсвэл Нэр бичнэ үү..." />
    </div>

    <button class="btn btn-search" onclick="searchUser()">🔍 Хайх</button>

    <!-- Олдсон сурагчийн мэдээлэл харагдах карт -->
    <div id="userCard">
      <p><b>ID:</b> <span id="resId">-</span></p>
      <p><b>Нэр:</b> <span id="resName">-</span></p>
      <p><b>Авсан уух юмны тоо:</b> <span id="resCount" style="font-size:18px; color:#d9534f; font-weight:bold;">0</span></p>
    </div>

    <button id="giveBtn" class="btn btn-give" onclick="giveDrink()" disabled>+1 Уух юм олгох</button>

    <div id="status"></div>
  </div>

  <script>
    let html5QrCode;
    // ТАНЫ GOOGLE APPS SCRIPT WEB APP URL:
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby48AGGTzygrb0kCK6yVxtET7RB4y5d0q6G8IgEL7VZuTzSNMNlBvqArNtH5tn8GOXAeg/exec"; 

    let currentUser = null;

    // 1. QR КАМЕР НЭЭХ
    function startScan() {
      resetUI();
      document.getElementById('status').innerText = "Камер нээж байна...";

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      html5QrCode.start(
        { facingMode: "environment" }, 
        { fps: 15, qrbox: { width: 250, height: 250 } }, 
        (decodedText) => {
          document.getElementById('searchInput').value = decodedText;
          html5QrCode.stop();
          searchUser(); // Уншмагц автоматаар хайна
        }
      ).catch(err => {
        showStatus("❌ Алдаа: " + err, "red");
      });
    }

    // 2. ХЭРЭГЛЭГЧ ХАЙХ (ID эсвэл Нэрээр)
    async function searchUser() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) {
        showStatus("⚠️ ID эсвэл Нэр бичнэ үү!", "orange");
        return;
      }

      showStatus("⏳ Google Sheet-ээс хайж байна...", "#007bff");

      try {
        const response = await fetch(`${GOOGLE_SCRIPT_URL}?id=${encodeURIComponent(query)}`, { redirect: "follow" });
        const result = await response.json();

        if (result.exists) {
          currentUser = result.data;
          displayUser(currentUser);
          showStatus("✅ Хэрэглэгч олдлоо!", "#28a745");
        } else {
          resetUI();
          showStatus("❌ Ийм ID эсвэл Нэртэй сурагч олдсонгүй!", "red");
        }
      } catch (err) {
        showStatus("❌ Алдаа гарлаа: " + err, "red");
      }
    }

    // 3. УУХ ЮМ ОЛГОХ (+1)
    async function giveDrink() {
      if (!currentUser) return;

      const giveBtn = document.getElementById('giveBtn');
      giveBtn.disabled = true;
      showStatus("⏳ Баазад хадгалж байна...", "#007bff");

      try {
        const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=drink&id=${encodeURIComponent(currentUser.id)}`, { redirect: "follow" });
        const result = await response.json();

        if (result.success) {
          currentUser.drinkCount = result.drinkCount;
          displayUser(currentUser);

          // 5 БУЮУ ТҮҮНЭЭС ДЭЭШ ХҮРБЭЛ ALERT АНХААРУУЛГА ӨГӨХ
          if (currentUser.drinkCount >= 5) {
            alert(`⚠️ АНХААРУУЛГА!\n\n${currentUser.name} (ID: ${currentUser.id}) сурагч хэзээ хэдийнэ ${currentUser.drinkCount} удаа уух юм авсан байна!`);
          }

          showStatus(`✅ Амжилттай олгогдлоо! Нийт: ${currentUser.drinkCount}`, "#28a745");
        } else {
          showStatus("❌ Хадгалахад алдаа гарлаа", "red");
          giveBtn.disabled = false;
        }
      } catch (err) {
        showStatus("❌ Сүлжээний алдаа: " + err, "red");
        giveBtn.disabled = false;
      }
    }

    function displayUser(user) {
      document.getElementById('resId').innerText = user.id;
      document.getElementById('resName').innerText = user.name;
      document.getElementById('resCount').innerText = user.drinkCount;
      document.getElementById('userCard').style.display = "block";
      document.getElementById('giveBtn').disabled = false;
    }

    function resetUI() {
      currentUser = null;
      document.getElementById('userCard').style.display = "none";
      document.getElementById('giveBtn').disabled = true;
      document.getElementById('status').innerText = "";
    }

    function showStatus(text, color) {
      const statusDiv = document.getElementById('status');
      statusDiv.style.color = color;
      statusDiv.innerText = text;
    }
  </script>

</body>
</html>
