<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSU Drink Claim</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 10px 16px 28px; background: #00251d; color: #333; }
    .hero-image { width: calc(100% + 48px); height: 210px; margin: 0 -24px 22px; object-fit: cover; object-position: center; display: block; }
    .card { max-width: 430px; margin: 0 auto; background: white; padding: 0 24px 26px; border-radius: 18px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    .card h2 { margin: 0 0 18px; color: #17324d; font-size: 25px; }
    
    .input-group { margin: 0; text-align: left; }
    .input-group label { font-size: 14px; color: #555; font-weight: bold; display: block; margin-bottom: 8px; }
    
    input[type="number"] {
      width: 100%;
      padding: 14px;
      font-size: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 12px 12px 0 0;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      transition: border 0.2s;
      box-sizing: border-box;
    }
    input[type="number"]:focus { border-color: #007bff; }

    .btn-claim {
      background: #17324d;
      color: white;
      border: none;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    #checkBtn { border-radius: 0 0 12px 12px; margin-top: -2px; background: #0b8f7d; box-shadow: inset 0 0 0 2px rgba(64, 230, 204, 0.35); }
    #checkBtn:hover { background: #087766; }
    #claimBtn { margin-top: 16px; }
    .btn-claim:active { opacity: 0.8; transform: translateY(1px); }
    .btn-claim:disabled { background: #94a3b8; cursor: not-allowed; }

    /* Animated green banner shown to the server */
    .successBanner {
      display: none;
      background: linear-gradient(135deg, #28a745, #20c997);
      color: white;
      padding: 22px;
      border-radius: 16px;
      margin-top: 15px;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 10px rgba(40,167,69,0.4); }
      100% { transform: scale(1.02); box-shadow: 0 0 25px rgba(40,167,69,0.8); }
    }

    .banner-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
    .user-name { font-size: 22px; font-weight: 800; margin: 5px 0; }
    .live-clock { font-size: 26px; font-weight: 800; background: rgba(0,0,0,0.18); padding: 8px 15px; border-radius: 10px; display: inline-block; margin: 12px 0; letter-spacing: 1px; }

    /* Toast / error message */
    #errorBox {
      display: none;
      background: #fff8ed;
      color: #7a3e12;
      padding: 13px 16px;
      border: 1px solid #f2c892;
      border-left: 4px solid #e38a2d;
      border-radius: 10px;
      margin-top: 16px;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.45;
      text-align: left;
      box-shadow: 0 4px 12px rgba(126, 73, 20, 0.08);
    }
  </style>
</head>
<body>

  

  <div class="card">
    
    

    <div id="formSection">
      <div class="input-group">
        <img class="hero-image" src="Oirkhon_small.jpg" alt="Oirkhon travel destination">
        <h2>2026 Staff Fall Camping</h2>
        <label for="phoneInput">Enter your registered phone number.</label>
        <input type="number" id="phoneInput" placeholder="________" pattern="[0-9]*" onkeypress="if(event.key==='Enter') checkStaff()" />
      </div>

      <button class="btn-claim" id="checkBtn" onclick="checkStaff()">Check phone number</button>
      <div id="errorBox"></div>


        <div id="infoBanner" class="successBanner">
      <div class="banner-title" id="buss_number"></div>
      <div class="user-name" id="bannerName1">-</div>
      <div class="user-name" id="bannerLname1">-</div>
      <div style="font-size: 14px;">Drinks claimed: <b id="bannerCount1">0</b>/5</div>
    </div>

      <button class="btn-claim" id="claimBtn" onclick="claimDrink()" style="display: none;">🥤 Claim Drink (+1)</button>
                <!-- BANNER FOR THE SERVER -->
    <div id="successBanner" class="successBanner">
      <div class="banner-title">✅ PLEASE PROVIDE THE DRINK</div>
      <div class="user-name" id="bannerName">-</div>
      <div class="user-name" id="bannerLname">-</div>
      <div style="font-size: 14px;">Drinks claimed: <b id="bannerCount">0</b>/5</div>
    </div>
    
    </div>



    
  </div>

  <script>
    // Replace this with your own Apps Script URL.
    // const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby48AGGTzygrb0kCK6yVxtET7RB4y5d0q6G8IgEL7VZuTzSNMNlBvqArNtH5tn8GOXAeg/exec";
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby1xmPvPE5BzXJ7zyNHfrN1XFkXDnTOpTAY6RDN4LNz5nWDhCO2KDTwgQHiGZMwdDw-OQ/exec";

    async function checkStaff() {
      const phone = phoneInput.value.trim();
      if (!phone || phone.length < 8) {
                showError("⚠️ Please enter a valid phone number!");
                return;
      }

       try {
        const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=check&phone=${encodeURIComponent(phone)}`, { redirect: "follow" });
        const data = await response.json();

        if (data.success) {
          // Hide the form and show the success banner.
          //document.getElementById('formSection').style.display = 'none';
          document.getElementById('buss_number').innerText = `Your bus number is #${data.bus}`;
          document.getElementById('bannerName1').innerText = data.name;
          document.getElementById('bannerLname1').innerText = data.lname;
          document.getElementById('bannerCount1').innerText = data.drinkCount;
          document.getElementById('infoBanner').style.display = 'block';

          const claimBtn = document.getElementById('claimBtn');
          claimBtn.style.display = 'block';



        } else {
          showError("❌ " + data.message);
        }
      } catch (err) {
        showError("❌ Connection error! Please try again.");
      }

    }

    async function claimDrink() {
      const phoneInput = document.getElementById('phoneInput');
      const phone = phoneInput.value.trim();
      const claimBtn = document.getElementById('claimBtn');
      const errorBox = document.getElementById('errorBox');

      errorBox.style.display = 'none';

      

      claimBtn.disabled = true;
      claimBtn.innerText = "⏳ Checking...";

      try {
        const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=claim&phone=${encodeURIComponent(phone)}`, { redirect: "follow" });
        const data = await response.json();

        if (data.success) {
          // Hide the form and show the success banner.
          //document.getElementById('formSection').style.display = 'none';
          // document.getElementById('bannerName').innerText = data.name;
          document.getElementById('bannerCount1').innerText = data.drinkCount;
          // document.getElementById('successBanner').style.display = 'block';

          // Update the clock every second to prevent screenshot reuse.
          // updateClock();
          // setInterval(updateClock, 1000);

          if (data.drinkCount >= 5) {
            //showError("❌ You have already claimed the maximum number of drinks (5).");
            claimBtn.disabled = true;
            claimBtn.innerText = "🥤 Claim Drink (+1)";
          } else {
            claimBtn.disabled = false;
            claimBtn.innerText = "🥤 Claim Drink (+1)";
          }
          

        } else {
          showError("❌ " + data.message);
          claimBtn.disabled = false;
          claimBtn.innerText = "🥤 Claim Drink (+1)";
        }
      } catch (err) {
        showError("❌ Connection error! Please try again.");
        claimBtn.disabled = false;
        claimBtn.innerText = "🥤 Claim Drink (+1)";
      }
    }



    function showError(msg) {
      const err = document.getElementById('errorBox');
      err.innerText = msg;
      err.style.display = 'block';
    }
  </script>

</body>
</html>
