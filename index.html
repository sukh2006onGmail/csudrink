<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSU Drink Claim</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 20px; background: #f0f2f5; color: #333; }
    .card { max-width: 380px; margin: 20px auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
    
    .input-group { margin: 20px 0; text-align: left; }
    .input-group label { font-size: 14px; color: #555; font-weight: bold; display: block; margin-bottom: 8px; }
    
    input[type="number"] {
      width: 93%;
      padding: 14px;
      font-size: 20px;
      border: 2px solid #cbd5e1;
      border-radius: 12px;
      text-align: center;
      letter-spacing: 2px;
      outline: none;
      transition: border 0.2s;
    }
    input[type="number"]:focus { border-color: #007bff; }

    .btn-claim {
      background: #007bff;
      color: white;
      border: none;
      padding: 16px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-claim:active { opacity: 0.8; }
    .btn-claim:disabled { background: #94a3b8; cursor: not-allowed; }

    /* Зөөгчид харуулах Анимейшнтэй Ногоон Баннер */
    #successBanner {
      display: none;
      background: linear-gradient(135deg, #28a745, #20c997);
      color: white;
      padding: 22px;
      border-radius: 16px;
      margin-top: 15px;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 10px rgba(40,167,69,0.4); }
      100% { transform: scale(1.02); box-shadow: 0 0 25px rgba(40,167,69,0.8); }
    }

    .banner-title { font-size: 18px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; }
    .user-name { font-size: 22px; font-weight: 800; margin: 5px 0; }
    .live-clock { font-size: 26px; font-weight: 800; background: rgba(0,0,0,0.18); padding: 8px 15px; border-radius: 10px; display: inline-block; margin: 12px 0; letter-spacing: 1px; }

    /* Toast / Алдааны мэдээлэл */
    #errorBox {
      display: none;
      background: #dc3545;
      color: white;
      padding: 14px;
      border-radius: 12px;
      margin-top: 15px;
      font-size: 15px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🥤 CSU Уух зүйл авах</h2>
    <p style="color: #666; font-size: 14px;">Бүртгэлтэй утасны дугаараа оруулна уу.</p>

    <div id="formSection">
      <div class="input-group">
        <label for="phoneInput">Утасны дугаар:</label>
        <input type="number" id="phoneInput" placeholder="88112233" pattern="[0-9]*" onkeypress="if(event.key==='Enter') claimDrink()" />
      </div>

      <button class="btn-claim" id="claimBtn" onclick="claimDrink()">🥤 Уух юм авах (+1)</button>
    </div>

    <!-- ЗӨӨГЧИД ХАРУУЛАХ БАННЕР -->
    <div id="successBanner">
      <div class="banner-title">✅ УУХ ЮМ ОЛГОНО УУ</div>
      <div class="user-name" id="bannerName">-</div>
      <div class="live-clock" id="liveClock">00:00:00</div>
      <div style="font-size: 14px;">Нийт авсан: <b id="bannerCount">0</b>/5</div>
    </div>

    <div id="errorBox"></div>
  </div>

  <script>
    // Та өөрийн Apps Script-ийн URL хаягийг заавал солиорой!
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby48AGGTzygrb0kCK6yVxtET7RB4y5d0q6G8IgEL7VZuTzSNMNlBvqArNtH5tn8GOXAeg/exec";

    async function claimDrink() {
      const phoneInput = document.getElementById('phoneInput');
      const phone = phoneInput.value.trim();
      const claimBtn = document.getElementById('claimBtn');
      const errorBox = document.getElementById('errorBox');

      errorBox.style.display = 'none';

      if (!phone || phone.length < 8) {
        showError("⚠️ Зөв утасны дугаар оруулна уу!");
        return;
      }

      claimBtn.disabled = true;
      claimBtn.innerText = "⏳ Шалгаж байна...";

      try {
        const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=claim&phone=${encodeURIComponent(phone)}`, { redirect: "follow" });
        const data = await response.json();

        if (data.success) {
          // Формыг нууж, амжилттай баннерыг харуулна
          document.getElementById('formSection').style.display = 'none';
          document.getElementById('bannerName').innerText = data.name;
          document.getElementById('bannerCount').innerText = data.drinkCount;
          document.getElementById('successBanner').style.display = 'block';

          // Дэлгэцийн зураг авч ашиглахаас сэргийлж цагийг секунд бүр гүйгээр тохируулна
          updateClock();
          setInterval(updateClock, 1000);

        } else {
          showError("❌ " + data.message);
          claimBtn.disabled = false;
          claimBtn.innerText = "🥤 Уух юм авах (+1)";
        }
      } catch (err) {
        showError("❌ Холболтын алдаа гарлаа! Дахин туршина уу.");
        claimBtn.disabled = false;
        claimBtn.innerText = "🥤 Уух юм авах (+1)";
      }
    }

    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString('mn-MN', { hour12: false });
      document.getElementById('liveClock').innerText = timeStr;
    }

    function showError(msg) {
      const err = document.getElementById('errorBox');
      err.innerText = msg;
      err.style.display = 'block';
    }
  </script>

</body>
</html>
